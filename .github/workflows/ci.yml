name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Verify
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify localization consistency
        run: scripts/check-l10n.sh

      - name: Build products (debug)
        run: |
          swift build -c debug --product proctor
          swift build -c debug --product ProctorApp

      - name: Run baseline behavior snapshot
        run: scripts/baseline.sh ci

      - name: Verify app assembly
        run: scripts/build-app.sh
